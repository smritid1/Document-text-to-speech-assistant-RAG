services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama   
    restart: unless-stopped
    # Uncomment for GPU acceleration (needs nvidia-container-toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["sh", "-c", "sleep 5 && OLLAMA_HOST=http://ollama:11434 ollama pull llama3"]
    restart: "no"  

    
  app:
    build: .
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      RAG_LLM_MODEL: "llama3"
      RAG_PERSIST_DIRECTORY: "/data/chroma_db"
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - chroma_data:/data/chroma_db   
    restart: unless-stopped

volumes:
  ollama_models:
  chroma_data: